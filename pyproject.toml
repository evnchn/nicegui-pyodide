[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nicegui-pyodide"
version = "0.1.0"
description = "Run NiceGUI entirely in the browser via Pyodide/PyScript — no server — as an external extension to stock NiceGUI (no fork, no core patches)."
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "evnchn" }]
keywords = ["nicegui", "pyodide", "pyscript", "wasm", "browser", "webassembly"]
# Pinned to a nicegui range: the shipped static/nicegui.js is a pyodide-patched
# copy of that release's nicegui.js. Widen only after re-checking the JS delta.
dependencies = ["nicegui>=3.14,<3.15"]

[project.optional-dependencies]
build = ["build>=1.0"]
test = ["pytest>=7", "playwright>=1.40"]

[project.scripts]
nicegui-pyodide-build = "nicegui_pyodide.build.cli:main"

[tool.setuptools.packages.find]
include = ["nicegui_pyodide*"]

[tool.setuptools.package-data]
nicegui_pyodide = [
    "static/*.js",
    "static/component_overrides/*.js",
    "templates/*",
]
