<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiceGUI in the browser (Pyodide)</title>

    <!-- CSS layer ordering must match NiceGUI's server-side index.html cascade -->
    <style>
        @layer theme, base, quasar, nicegui, components, utilities, overrides, quasar_importants;
        @import url("fonts.css") layer(base);
        @import url("quasar.unimportant.prod.css") layer(quasar);
        @import url("quasar.important.prod.css") layer(quasar_importants);
        @import url("nicegui.css") layer(nicegui);
        @layer quasar {
            blockquote, dd, dl, figure, h1, h2, h3, h4, h5, h6, hr, p, pre {
                margin: revert-layer; /* revert Quasar's margin styles */
            }
        }
        @layer overrides {
            .rotate-45, .rotate-90, .rotate-135, .rotate-180, .rotate-225, .rotate-270, .rotate-315 { rotate: 0deg; }
            .column.inline, .flex.inline, .row.inline { display: inline-flex; }
            .nicegui-dialog-open, .nicegui-select-popup-open { scroll-behavior: auto !important; }
        }
        #loading { padding: 2em; font-family: sans-serif; color: #666; }
    </style>
    <script src="tailwindcss.min.js"></script>

    <!-- BEGIN IMPORTMAP (generated by nicegui-pyodide-build — do not edit) -->
    <script type="importmap">{ "imports": {} }</script>
    <!-- END IMPORTMAP -->
</head>
<body>
    <div id="loading">Loading Pyodide and NiceGUI…</div>
    <div id="app"></div>

    <script type="module">
        import * as Vue from './vue.esm-browser.prod.js';
        window.Vue = Vue;
    </script>
    <script defer src="quasar.umd.prod.js"></script>

    <!-- Bridge must exist BEFORE nicegui.js loads so it detects Pyodide mode -->
    <script>
        window.niceguiBridge = {
            handleMessage: function (type) { console.log('Bridge (pre-init):', type); },
            onEvent: null,
            onJavascriptResponse: null,
        };
    </script>

    <!-- setHTML polyfill via DOMPurify (some browsers lack Element.prototype.setHTML) -->
    <script type="module">
        if (!Element.prototype.setHTML) {
            const { default: DOMPurify } = await import('./static/dompurify.mjs');
            Element.prototype.setHTML = function (html) { this.innerHTML = DOMPurify.sanitize(html); };
        }
    </script>

    <script defer src="nicegui.js"></script>

    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <script type="py" src="entrypoint.py" config="pyscript.toml"></script>
</body>
</html>
